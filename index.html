<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aippy Live Link Extractor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #00ff88;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        textarea {
            width: 90%;
            height: 80px;
            padding: 12px;
            border: 2px solid #333;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 14px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
            resize: none;
        }
        textarea:focus {
            border-color: #00ff88;
        }
        button {
            background-color: #00ff88;
            color: #121212;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #00cc6e;
        }
        button:active {
            transform: scale(0.98);
        }
        .error {
            color: #ff4a4a;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Aippy Download-Fix</h1>
    <p>Füge einfach den normalen Spiel-Link (aippy.ai) ODER den src-Link aus der Konsole hier ein.</p>
    
    <textarea id="rawInput" placeholder="Z. B. https://aippy.ai"></textarea>
    <br>
    <button onclick="extractAndOpen()">Spiel live öffnen</button>
    
    <div id="errorMessage" class="error"></div>
</div>

<script>
function extractAndOpen() {
    let input = document.getElementById('rawInput').value.trim();
    const errorDiv = document.getElementById('errorMessage');
    errorDiv.style.display = "none"; 

    if (!input) {
        errorDiv.innerText = "Bitte füge zuerst einen Link ein.";
        errorDiv.style.display = "block";
        return;
    }

    // 1. Check: Handelt es sich um den extrahierten Iframe-Code aus der Konsole?
    if (input.includes("src=")) {
        const srcMatch = input.match(/src=["'](https:\/\/[^"']+)["']/);
        if (srcMatch && srcMatch[1]) {
            input = srcMatch[1];
        }
    }

    // Bereinigung von HTML-Resten
    input = input.replace(/&amp;/g, "&");

    // Weg A: Es ist bereits ein direkter .live Link
    if (input.includes("aippy.live")) {
        window.open(input, '_blank');
        return;
    }

    // Weg B: Es ist ein normaler aippy.ai Projekt-Link
    if (input.includes("aippy.ai")) {
        // Wir ziehen die eindeutige Projektkennung (z.B. 2dqs oder 1SFx) vom Ende der URL
        const cleanUrl = input.replace(/\/\$/, ""); 
        const urlParts = cleanUrl.split("-");
        const projectId = urlParts[urlParts.length - 1];

        if (projectId && projectId.length >= 3) {
            // Umleitung auf das direkte, unbeschränkte Web-Player-Interface von Aippy
            const dynamicRunUrl = `https://aippy.ai{projectId}`;
            window.open(dynamicRunUrl, '_blank');
        } else {
            errorDiv.innerText = "Die Projekt-ID am Ende des Links konnte nicht erkannt werden.";
            errorDiv.style.display = "block";
        }
    } else {
        errorDiv.innerText = "Fehler: Ungültiges Linkformat. Bitte einen aippy.ai-Link nutzen.";
        errorDiv.style.display = "block";
    }
}
</script>

</body>
</html>
