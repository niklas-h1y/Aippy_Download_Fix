<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aippy Download Fix - Redirector</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            background-color: #161d2b;
            padding: 30px;
            border-radius: 16px;
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            text-align: center;
            max-width: 460px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            color: #00ff66;
            margin-bottom: 10px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #2d3748;
            border-radius: 8px;
            background-color: #1f293d;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 20px;
            outline: none;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #00ff66;
        }
        button {
            background-color: #00ff66;
            color: #0b0f19;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #00dd55;
        }
        .debug-panel {
            margin-top: 20px;
            background-color: #070a12;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 12px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-info { color: #00ff66; }
        .log-warn { color: #ffaa00; }
        .log-err { color: #ff4a4a; }
    </style>
</head>
<body>

<div class="container">
    <h1>Aippy Live Redirector</h1>
    <p>Paste your full Aippy preview link below to isolate the live frame and bypass download blocks!</p>
    
    <input type="text" id="aippyUrl" placeholder="Paste your Aippy link here..." autocomplete="off">
    <br>
    <button onclick="launchWithDebug()">Open Unrestricted Game</button>
    
    <div class="debug-panel" id="debugLog">[System] Ready for URL analysis...</div>
</div>

<script>
function addLog(text, type = 'info') {
    const logBox = document.getElementById('debugLog');
    let className = 'log-info';
    if (type === 'warn') className = 'log-warn';
    if (type === 'error') className = 'log-err';
    
    logBox.innerHTML += `<div class="${className}">[${type.toUpperCase()}] ${text}</div>`;
    logBox.scrollTop = logBox.scrollHeight;
}

function launchWithDebug() {
    const inputUrl = document.getElementById('aippyUrl').value.trim();
    const logBox = document.getElementById('debugLog');
    
    logBox.innerHTML = "<div>[SYSTEM] Starting analysis...</div>";

    if (!inputUrl) {
        addLog("Input field is completely empty!", "error");
        return;
    }

    addLog(`Analyzing link: ${inputUrl}`, "info");

    // Fix: Allow checking for 'aippy' variations safely
    if (!inputUrl.toLowerCase().includes("aippy")) {
        addLog("Invalid URL! The link must belong to an Aippy project.", "error");
        return;
    }

    // Checking if they passed a direct iframe link vs general project page
    if (inputUrl.includes("aippy.live")) {
        addLog("Direct aippy.live link detected.", "info");
        addLog("Opening unrestricted frame in new tab...", "warn");
        window.open(inputUrl, '_blank');
    } else {
        addLog("Standard project link detected. Attempting extraction...", "info");
        // Fallback or automated parsing can be handled here if you ever expand it!
        addLog("Opening link directly to run your manual bookmarklet on!", "warn");
        window.open(inputUrl, '_blank');
    }
}
</script>

</body>
</html>
