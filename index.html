<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta Dash - Instanter Download Fix</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161d2b;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            text-align: center;
            max-width: 460px;
            width: 100%;
        }
        h1 {
            color: #00ff66;
            margin-bottom: 10px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        input[type="text"] {
            width: 88%;
            padding: 12px;
            border: 2px solid #2d3748;
            border-radius: 6px;
            background-color: #1f293d;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #00ff66;
        }
        button {
            background-color: #00ff66;
            color: #0b0f19;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #00dd55;
        }
        button:active {
            transform: scale(0.98);
        }
        .error {
            color: #ff4a4a;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Beta Dash Link-Fixer</h1>
    <p>Füge einfach den normalen Spiele-Link aus der Aippy-Adresszeile ein, um das Spiel direkt unblockiert zu starten!</p>
    
    <input type="text" id="aippyUrl" placeholder="https://aippy.ai" autocomplete="off">
    <br>
    <button onclick="convertAndOpen()">Spiel unblockiert öffnen</button>
    
    <div id="errorMessage" class="error"></div>
</div>

<script>
function convertAndOpen() {
    const input = document.getElementById('aippyUrl').value.trim();
    const errorDiv = document.getElementById('errorMessage');
    errorDiv.style.display = "none"; 

    if (!input || !input.includes("aippy.ai/")) {
        errorDiv.innerText = "Bitte füge einen gültigen aippy.ai Link ein!";
        errorDiv.style.display = "block";
        return;
    }

    // Wandelt den normalen Link vollautomatisch in die IFrame-freie Embed-Ansicht um
    if (input.includes("aippy.ai/@")) {
        const targetUrl = input.replace("aippy.ai/", "aippy.ai/embed/");
        
        // Öffnet das Spiel im Vollbild – der Download-Button funktioniert sofort!
        window.open(targetUrl, '_blank');
    } else {
        errorDiv.innerText = "Ungültiges Linkformat. Der Link muss ein '@' Zeichen enthalten.";
        errorDiv.style.display = "block";
    }
}
</script>

</body>
</html>
