<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta Dash - Universal Mobile Fix</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            background-color: #161d2b;
            padding: 30px;
            border-radius: 16px;
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            color: #00ff66;
            margin-bottom: 10px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.3);
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #2d3748;
            border-radius: 8px;
            background-color: #1f293d;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #00ff66;
        }
        button {
            background-color: #00ff66;
            color: #0b0f19;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            box-sizing: border-box;
        }
        button:hover {
            background-color: #00dd55;
        }
        button:active {
            transform: scale(0.98);
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            display: none;
            font-weight: bold;
            line-height: 1.4;
        }
        .error { color: #ff4a4a; }
        .loading { color: #00ff66; }
    </style>
</head>
<body>

<div class="container">
    <h1>Beta Dash Mobile Fix</h1>
    <p>Füge einfach den normalen aippy.ai Link ein. Das Tool extrahiert das Spiel vollautomatisch für dein Handy!</p>
    
    <input type="text" id="aippyUrl" placeholder="https://aippy.ai" autocomplete="off">
    <br>
    <button onclick="startMobileExtract()">Spiel unblockiert öffnen</button>
    
    <div id="statusMessage" class="status"></div>
</div>

<script>
async function startMobileExtract() {
    const inputUrl = document.getElementById('aippyUrl').value.trim();
    const statusDiv = document.getElementById('statusMessage');
    
    statusDiv.className = "status";
    statusDiv.style.display = "none";

    if (!inputUrl || !inputUrl.includes("aippy.ai")) {
        statusDiv.innerText = "Bitte gib einen gültigen aippy.ai Link ein!";
        statusDiv.classList.add("error");
        statusDiv.style.display = "block";
        return;
    }

    statusDiv.innerText = "Scanne Aippy-Server... Bitte warten...";
    statusDiv.classList.add("loading");
    statusDiv.style.display = "block";

    // Wir nutzen den freien AllOrigins Open-Source Proxy, um den Iframe-Inhalt serverseitig zu holen
    const universalProxy = `https://allorigins.win{encodeURIComponent(inputUrl)}`;

    try {
        const response = await fetch(universalProxy);
        if (!response.ok) throw new Error();
        
        const data = await response.json();
        const serverHtml = data.contents;

        // Sucht im HTML-Quellcode nach der echten, versteckten .live URL des Spiels
        const urlRegex = /(https:\/\/[a-zA-Z0-9-]+\.aippy\.live[^\s"'>]*)/;
        const match = serverHtml.match(urlRegex);

        if (match && match) {
            let cleanLiveUrl = match.replace(/&amp;/g, "&");
            statusDiv.style.display = "none";
            
            // Öffnet das Spiel komplett isoliert in einem neuen Tab am Smartphone/Tablet
            window.open(cleanLiveUrl, '_blank');
        } else {
            throw new Error();
        }
    } catch (e) {
        // Fallback-Meldung, falls Aippy automatisierte Anfragen blockiert
        statusDiv.innerHTML = "Automatische Erkennung blockiert.<br><span style='color:#ffaa00;'>Tipp: Klicke im Spiel kurz auf 'Remix' und füge DIESE URL hier ein!</span>";
        statusDiv.className = "status error";
        statusDiv.style.display = "block";
    }
}
</script>

</body>
</html>
