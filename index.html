<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aippy Live Link Extractor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #00ff88;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        textarea {
            width: 90%;
            height: 80px;
            padding: 12px;
            border: 2px solid #333;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 14px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
            resize: none;
        }
        textarea:focus {
            border-color: #00ff88;
        }
        button {
            background-color: #00ff88;
            color: #121212;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #00cc6e;
        }
        button:active {
            transform: scale(0.98);
        }
        .error {
            color: #ff4a4a;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Aippy Download-Fix</h1>
    <p>Füge hier den kopierten <strong>src-Link</strong> oder den ganzen <strong>&lt;iframe&gt;-Code</strong> aus Eruda ein, um das Spiel mit funktionierendem Download direkt zu öffnen!</p>
    
    <textarea id="rawInput" placeholder="Hier den Link oder Iframe-Code einfügen (z.B. https://...)"></textarea>
    <br>
    <button onclick="extractAndOpen()">Spiel live öffnen</button>
    
    <div id="errorMessage" class="error"></div>
</div>

<script>
function extractAndOpen() {
    const input = document.getElementById('rawInput').value.trim();
    const errorDiv = document.getElementById('errorMessage');
    errorDiv.style.display = "none"; 

    if (!input) {
        errorDiv.innerText = "Bitte füge zuerst etwas ein.";
        errorDiv.style.display = "block";
        return;
    }

    let targetUrl = "";

    // Falls der Nutzer den ganzen <iframe src="..."> Code eingefügt hat, filtern wir die URL heraus
    if (input.includes("src=")) {
        const srcMatch = input.match(/src=["'](https:\/\/[^"']+)["']/);
        if (srcMatch && srcMatch[1]) {
            targetUrl = srcMatch[1];
        }
    } else if (input.startsWith("http")) {
        // Falls der Nutzer direkt die reine URL eingefügt hat
        targetUrl = input;
    }

    // Überprüfen, ob es sich um eine gültige aippy.live Adresse handelt
    if (targetUrl && targetUrl.includes("aippy.live")) {
        // Ersetzt HTML-Sicherheitszeichen (&amp;) falls vorhanden durch ein echtes &
        targetUrl = targetUrl.replace(/&amp;/g, "&");
        
        // Öffnet das Spiel im neuen Tab – ohne Blockaden
        window.open(targetUrl, '_blank');
    } else {
        errorDiv.innerText = "Fehler: Es konnte keine gültige 'aippy.live' Adresse im Text gefunden werden.";
        errorDiv.style.display = "block";
    }
}
</script>

</body>
</html>
