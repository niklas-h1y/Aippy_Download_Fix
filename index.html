<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aippy Download Unblocker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161d2b;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            text-align: center;
            max-width: 460px;
            width: 100%;
        }
        h1 {
            color: #00ff66;
            margin-bottom: 10px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        input[type="text"] {
            width: 88%;
            padding: 12px;
            border: 2px solid #2d3748;
            border-radius: 6px;
            background-color: #1f293d;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #00ff66;
        }
        button {
            background-color: #00ff66;
            color: #0b0f19;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #00dd55;
        }
        button:active {
            transform: scale(0.98);
        }
        .error {
            color: #ff4a4a;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Beta Dash Download-Fix</h1>
    <p>Füge einfach den normalen Spiele-Link (aippy.ai) aus der Adresszeile hier ein, um das Spiel mit funktionierendem Download zu starten!</p>
    
    <input type="text" id="aippyUrl" placeholder="https://aippy.ai" autocomplete="off">
    <br>
    <button onclick="fixAndOpen()">Spiel direkt starten</button>
    
    <div id="errorMessage" class="error"></div>
</div>

<script>
function fixAndOpen() {
    const input = document.getElementById('aippyUrl').value.trim();
    const errorDiv = document.getElementById('errorMessage');
    errorDiv.style.display = "none"; 

    if (!input || !input.includes("aippy.ai")) {
        errorDiv.innerText = "Bitte füge einen gültigen aippy.ai Link ein!";
        errorDiv.style.display = "block";
        return;
    }

    // Wir schneiden alles ab, was vor dem "@" Zeichen steht, um den reinen Pfad zu bekommen
    // Beispiel: "@JohnTheTeamerCreatorTeam/geometry-dash-clone-2dqs"
    const pathParts = input.split("aippy.ai/");
    if (pathParts.length > 1) {
        const cleanPath = pathParts[1].replace(/\/\$/, ""); // Entfernt eventuelle Schrägstriche am Ende
        
        // Wir bauen die offizielle Standalone-Runtime von Aippy nach.
        // Das bricht das Spiel aus dem blockierten Frame der Vorschauseite heraus!
        const targetUrl = `https://aippy.ai{cleanPath}`;
        
        window.open(targetUrl, '_blank');
    } else {
        errorDiv.innerText = "Der Link konnte nicht verarbeitet werden. Bitte kopiere ihn direkt aus der Adresszeile.";
        errorDiv.style.display = "block";
    }
}
</script>

</body>
</html>
