<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta Dash - Ultimate Mobile Unblocker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            background-color: #161d2b;
            padding: 30px;
            border-radius: 16px;
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            color: #00ff66;
            margin-bottom: 10px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.3);
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #2d3748;
            border-radius: 8px;
            background-color: #1f293d;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #00ff66;
        }
        button {
            background-color: #00ff66;
            color: #0b0f19;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            box-sizing: border-box;
        }
        button:hover {
            background-color: #00dd55;
        }
        button:active {
            transform: scale(0.98);
        }
        .error {
            color: #ff4a4a;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Beta Dash Mobile Fix</h1>
    <p>Füge einfach den normalen aippy.ai Link ein. Das Tool bricht das Spiel ohne Installationen aus der Iframe-Sperre heraus!</p>
    
    <input type="text" id="aippyUrl" placeholder="https://aippy.ai" autocomplete="off">
    <br>
    <button onclick="launchMobileGame()">Spiel unblockiert öffnen</button>
    
    <div id="errorMessage" class="error"></div>
</div>

<script>
function launchMobileGame() {
    const inputUrl = document.getElementById('aippyUrl').value.trim();
    const errorDiv = document.getElementById('errorMessage');
    errorDiv.style.display = "none";

    if (!inputUrl || !inputUrl.includes("aippy.ai")) {
        errorDiv.innerText = "Bitte gib einen gültigen aippy.ai Link ein!";
        errorDiv.style.display = "block";
        return;
    }

    // Wir schneiden die einzigartige Projekt-ID am Ende der URL aus (z.B. 1SFx)
    const cleanUrl = inputUrl.replace(/\/\$/, ""); 
    const urlParts = cleanUrl.split("-");
    const projectId = urlParts[urlParts.length - 1];

    if (projectId && projectId.length >= 3) {
        // Da Aippy Scans blockiert, leiten wir das Handy direkt auf die unblockierte 
        // Export-Schnittstelle der Plattform um, wo der Download-Trigger aktiv erzwungen wird!
        const targetUrl = `https://aippy.ai{projectId}/html`;
        
        window.open(targetUrl, '_blank');
    } else {
        errorDiv.innerText = "Fehler: Die Projekt-ID (z.B. -1SFx) konnte am Ende des Links nicht gefunden werden.";
        errorDiv.style.display = "block";
    }
}
</script>

</body>
</html>
