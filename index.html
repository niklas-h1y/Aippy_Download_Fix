<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta Dash - Debug Edition</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            background-color: #161d2b;
            padding: 30px;
            border-radius: 16px;
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            text-align: center;
            max-width: 460px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            color: #00ff66;
            margin-bottom: 10px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #2d3748;
            border-radius: 8px;
            background-color: #1f293d;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 20px;
            outline: none;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #00ff66;
        }
        button {
            background-color: #00ff66;
            color: #0b0f19;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #00dd55;
        }
        /* Style für das integrierte Log-Fenster */
        .debug-panel {
            margin-top: 20px;
            background-color: #070a12;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 12px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-info { color: #00ff66; }
        .log-warn { color: #ffaa00; }
        .log-err { color: #ff4a4a; }
    </style>
</head>
<body>

<div class="container">
    <h1>Beta Dash Debugger</h1>
    <p>Füge deinen Aippy-Link ein. Das integrierte Log-Fenster zeigt dir sofort alle Fehler und URLs live an!</p>
    
    <input type="text" id="aippyUrl" placeholder="https://aippy.ai" autocomplete="off">
    <br>
    <button onclick="launchWithDebug()">Spiel unblockiert öffnen</button>
    
    <div class="debug-panel" id="debugLog">[System] Bereit für Link-Analyse...</div>
</div>

<script>
function addLog(text, type = 'info') {
    const logBox = document.getElementById('debugLog');
    let className = 'log-info';
    if (type === 'warn') className = 'log-warn';
    if (type === 'error') className = 'log-err';
    
    logBox.innerHTML += `<div class="${className}">[${type.toUpperCase()}] ${text}</div>`;
    logBox.scrollTop = logBox.scrollHeight; // Scrollt automatisch nach unten
}

function launchWithDebug() {
    const inputUrl = document.getElementById('aippyUrl').value.trim();
    const logBox = document.getElementById('debugLog');
    
    // Log-Fenster zurücksetzen
    logBox.innerHTML = "<div>[SYSTEM] Starte Analyse...</div>";

    if (!inputUrl) {
        addLog("Eingabefeld ist komplett leer!", "error");
        return;
    }

    addLog(`Eingegebener Link: ${inputUrl}`, "info");

    if (!inputUrl.includes("aippy.ai")) {
        addLog("Ungültige Domain! Der Link muss 'aippy.ai' beinhalten.", "error");
        return;
    }

    // 1. Schritt: URL säubern
    const cleanUrl = inputUrl.replace(/\/\$/, ""); 
    addLog(`Bereinigter Link: ${cleanUrl}`, "info");

    // 2. Schritt: URL in Teile zerlegen
    const urlParts = cleanUrl.split("-");
    addLog(`Erkannte URL-Segmente: ${urlParts.length}`, "info");

    // 3. Schritt: Projekt-ID filtern
    const projectId = urlParts[urlParts.length - 1];
    addLog(`Gefundene ID am Ende: "${projectId}"`, "info");

    if (projectId && projectId.length >= 3) {
        // KORREKTUR: Wir bauen die URL jetzt absolut sicher mit festen Slashes zusammen!
        const targetUrl = "https://aippy.ai" + projectId;
        
        addLog(`Zusammengebaute Ziel-URL: ${targetUrl}`, "info");
        addLog("Öffne neuen Tab im Browser...", "warn");

        // Startet das Spiel im unblockierten Webplayer-Modus
        window.open(targetUrl, '_blank');
    } else {
        addLog("Fehler: Die Projekt-ID konnte nicht korrekt isoliert werden!", "error");
    }
}
</script>

</body>
</html>
