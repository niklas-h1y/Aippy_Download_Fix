<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta Dash - One-Click Fix</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0e14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #141923;
            padding: 35px;
            border-radius: 16px;
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        h1 {
            color: #00ff66;
            margin-bottom: 5px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }
        p {
            color: #ccd6e0;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        input[type="text"] {
            width: 88%;
            padding: 12px;
            border: 2px solid #2d3748;
            border-radius: 8px;
            background-color: #1a202c;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #00ff66;
        }
        button {
            background-color: #00ff66;
            color: #0a0e14;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #00dd55;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            display: none;
            font-weight: bold;
        }
        .error { color: #ff4a4a; }
        .loading { color: #00ff66; }
    </style>
</head>
<body>

<div class="container">
    <h1>Beta Dash Download-Fix</h1>
    <p>Füge einfach den normalen aippy.ai-Spiele-Link hier ein. Das Tool durchsucht die HTML-Elemente automatisch nach der Live-URL.</p>
    
    <input type="text" id="aippyUrl" placeholder="https://aippy.ai" autocomplete="off">
    <br>
    <button onclick="scanElements()">Spiel unblockiert öffnen</button>
    
    <div id="statusMessage" class="status"></div>
</div>

<script>
async function scanElements() {
    const inputUrl = document.getElementById('aippyUrl').value.trim();
    const statusDiv = document.getElementById('statusMessage');
    
    statusDiv.className = "status";
    statusDiv.style.display = "none";

    if (!inputUrl || !inputUrl.includes("aippy.ai")) {
        statusDiv.innerText = "Bitte füge einen gültigen aippy.ai Link ein!";
        statusDiv.classList.add("error");
        statusDiv.style.display = "block";
        return;
    }

    statusDiv.innerText = "Durchsuche HTML-Elemente nach Live-Iframe...";
    statusDiv.classList.add("loading");
    statusDiv.style.display = "block";

    // Wir rufen die öffentliche AllOrigins-API auf, um den Quelltext der Aippy-Seite im Hintergrund zu laden
    const apiQuery = `https://allorigins.win{encodeURIComponent(inputUrl)}`;

    try {
        const response = await fetch(apiQuery);
        if (!response.ok) throw new Error("API-Fehler");
        
        const data = await response.json();
        const fullHtml = data.contents; // Der rohe HTML-Inhalt der Zielseite

        // Regulärer Ausdruck durchsucht alle Code-Elemente nach der aippy.live-Adresse
        const iframeSrcRegex = /(https:\/\/[a-zA-Z0-9-]+\.aippy\.live[^\s"'>]*)/;
        const match = fullHtml.match(iframeSrcRegex);

        if (match && match[0]) {
            // Bereinigt codierte HTML-Zeichen (&amp;) für die URL-Parameter (?v=...)
            let realLiveUrl = match[0].replace(/&amp;/g, "&");
            
            statusDiv.style.display = "none";
            // Öffnet die gefundene Live-URL direkt ohne Einschränkungen
            window.open(realLiveUrl, '_blank');
        } else {
            throw new Error("Iframe-URL nicht im Code gefunden");
        }

    } catch (error) {
        statusDiv.innerText = "Fehler beim Auslesen. Stelle sicher, dass das Aippy-Projekt öffentlich ist!";
        statusDiv.className = "status error";
        statusDiv.style.display = "block";
    }
}
</script>

</body>
</html>
