<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #f0f6fc;
      margin: 0;
      padding: 16px;
      width: 220px;
      text-align: center;
    }
    h3 {
      font-size: 14px;
      margin: 0 0 12px 0;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    button {
      background-color: #238636;
      color: #ffffff;
      border: 1px solid rgba(240,246,252,0.1);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.1s ease;
    }
    button:hover {
      background-color: #2ea043;
    }
    button:active {
      background-color: #238636;
    }
    #status {
      font-size: 11px;
      color: #8b949e;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h3>Aippy Extractor</h3>
  <button id="extract-btn">Extract Live Frame</button>
  <div id="status">Ready</div>

  <script src="popup.js"></script>
</body>
</html>
